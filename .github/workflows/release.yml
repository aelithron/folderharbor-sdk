name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Lint/Check/Test
        run: |
          pnpm lint
          pnpm check-types
          pnpm test
      - name: Build
        run: pnpm build
      - name: Stage Release
        run: pnpm stage publish --provenance --no-git-checks
      
  docs:
    name: Update Docs
    runs-on: ubuntu-latest
    needs: release
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build Docs
        run: pnpm run docs
      - name: Upload Docs
        uses: actions/upload-pages-artifact@v3
        with:
          name: fh-ts-sdk-docs
          path: docs/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    