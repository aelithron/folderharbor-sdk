name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Release SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Lint/Check/Test
        run: |
          pnpm lint
          pnpm check-types
          pnpm test
      - name: Build
        run: pnpm build
      - name: Stage Release
        run: pnpm stage publish --access public --provenance